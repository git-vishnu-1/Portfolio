<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161e2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="120" r="220" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="260" fill="#0ea5e9" opacity="0.2" filter="url(#glow)" />

  <!-- Inner Card Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Logo Icon -->
  <g transform="translate(110, 110)">
    <rect width="72" height="72" rx="18" fill="url(#logoGrad)" />
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">VM</text>
  </g>

  <!-- Availability Pill -->
  <g transform="translate(205, 125)">
    <rect width="260" height="42" rx="21" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#10b981" />
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500" font-size="15" fill="#34d399">Available for Opportunities</text>
  </g>

  <!-- Name -->
  <text x="110" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="64" fill="url(#accent)" letter-spacing="-1.5">Vishnu Manoj</text>

  <!-- Title -->
  <text x="110" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500" font-size="32" fill="#f8fafc">Full Stack &amp; Backend Developer</text>

  <!-- Tech Description -->
  <text x="110" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="400" font-size="22" fill="#94a3b8">Node.js  •  Express  •  PostgreSQL  •  React  •  Prisma  •  REST APIs</text>

  <!-- Footer Info -->
  <line x1="110" y1="455" x2="1030" y2="455" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="110" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500" font-size="18" fill="#64748b">vishnumanoj.vercel.app</text>
  <text x="1030" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500" font-size="18" fill="#64748b" text-anchor="end">College of Engineering, Adoor</text>
</svg>